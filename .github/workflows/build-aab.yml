name: Build AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Prebuild Expo App
        run: npx expo prebuild --platform android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android App
        run: cd android && ./gradlew bundleRelease

      # - name: Sign AAB
      #   run: |
      #     keytool -importkeystore -srckeystore ${{ secrets.KEYSTORE }} \
      #     -destkeystore ${{ secrets.DEST_KEYSTORE }} \
      #     -srcstoretype JKS -deststoretype JKS \
      #     -srcalias aliasName -destalias aliasName \
      #     -srcstorepass ${{ secrets.KEYSTORE_PASSWORD }} -deststorepass ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyApp
          path: android/app/build/outputs/bundle/release/app-release.aab
